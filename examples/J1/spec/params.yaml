# J1 中央折叠铰 —— 全局唯一尺寸来源
# 单位：mm。坐标系沿用总装：X 纵向（沿栈桥）、Y 横向（缝在 Y=0）、Z 向上。
# 几何基准：LJQ_FLOOR_V07（工作态已确认）。本文件之外的脚本不得再写死尺寸。
project: J1
units: mm
source: LJQ_FLOOR_V07

axis:                 # J1 共用铰轴（沿 X）
  y: 0
  z: -75
  dir: X

beam:                 # 工字钢横梁（变截面，缝侧 500 高，墙侧 250 高）
  xc: 1500            # 试点节点：4 道横梁中的第 3 道（X=+1500）
  width: 150          # 翼缘宽（沿 X）
  tw: 8               # 腹板厚
  tf: 12              # 翼缘厚
  top: -150           # 梁顶 = 压型板顶
  bot_seam: -650      # 缝侧梁底
  bot_wall: -400      # 墙侧梁底
  taper_y: 1950       # 变截面起点（距缝的 |Y|）
  y_seam: 12          # 梁缝侧端 = 缝处端板内面
  y_wall: 2488        # 梁墙侧端 = 墙侧端板内面

seam_plate:           # 缝处端板，两半在 Y=0 对接
  t: 12
  z0: -650
  z1: -150

pad:                  # 垫板，坐在梁顶翼缘上
  x: 150
  y0: 50              # 内端（|Y|）
  y1: 180             # 外端（|Y|）
  z0: -150
  z1: -135            # 垫板顶 = 耳板脚底

lug:                  # 耳板
  t: 30
  eye_r: 60           # 眼环半径（1.5d，d=40）
  y_out: 160          # 脚底外端（|Y|）
  y_in: 50            # 脚底内端（|Y|）
  z_top: -60          # 脚顶 = 轴上 15
  bore: 41            # 耳板孔径。**本版唯一有意的几何变更**：V07 未开孔。
                      # 铰接装配必须有孔，否则销与耳板实体穿透、干涉检查无意义。
                      # 置 0 可严格复现 V07（回归脚本会自动按孔体积修正期望值）。
                      # R 侧两块耳板的 X 偏移写在 members.csv 的 xoff 列（每实例数据）

pin:
  d: 40
  len: 150

interfaces:           # 不建模，仅作为接口与校核依据
  deck_top: -150
  deck_opening_x: 170
  deck_opening_y: 180
  wall_line: 2500     # 注意：总装已改 2600，V07 底板仍是 2500，J1 试点沿用 V07
  fold_gap_model: 1   # V07 为避免多实体合并留的工艺缝，非设计意图，本版原样保留
